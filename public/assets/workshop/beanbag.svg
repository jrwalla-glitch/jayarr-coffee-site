<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="380" viewBox="0 0 280 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="kraft-front" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#8C6E42"/>
        <stop offset="15%"  stop-color="#A88450"/>
        <stop offset="35%"  stop-color="#C4A06A"/>
        <stop offset="55%"  stop-color="#D0AC74"/>
        <stop offset="72%"  stop-color="#BFA068"/>
        <stop offset="88%"  stop-color="#A08050"/>
        <stop offset="100%" stop-color="#7A5E38"/>
      </linearGradient>
      <linearGradient id="kraft-vertical" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(255,230,180,0.22)"/>
        <stop offset="30%"  stop-color="rgba(255,220,170,0.06)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
      </linearGradient>
      <linearGradient id="kraft-side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#8A6E40"/>
        <stop offset="50%"  stop-color="#7A5E34"/>
        <stop offset="100%" stop-color="#5E4528"/>
      </linearGradient>
      <linearGradient id="kraft-fold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#6A5030"/>
        <stop offset="50%"  stop-color="#8A6E42"/>
        <stop offset="100%" stop-color="#A08050"/>
      </linearGradient>
      <linearGradient id="label-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#F8F4EC"/>
        <stop offset="100%" stop-color="#EDE6D8"/>
      </linearGradient>
      <radialGradient id="warm-glow" cx="25%" cy="20%" r="80%">
        <stop offset="0%"  stop-color="rgba(255,200,120,0.18)"/>
        <stop offset="50%" stop-color="rgba(255,200,120,0.04)"/>
        <stop offset="100%" stop-color="rgba(255,200,120,0)"/>
      </radialGradient>
      <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(0,0,0,0.4)"/>
        <stop offset="55%"  stop-color="rgba(0,0,0,0.18)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
      <!-- Kraft paper grain texture (SVG filter) -->
      <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="42" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
        <feComponentTransfer in="grayNoise" result="faintNoise">
          <feFuncA type="linear" slope="0.06" intercept="0"/>
        </feComponentTransfer>
        <feBlend mode="multiply" in="SourceGraphic" in2="faintNoise"/>
      </filter>
    </defs>

    <!-- === GROUNDED SHADOW (single clean soft shadow) === -->
    <ellipse cx="132" cy="348" rx="82" ry="7" fill="url(#ground-shadow)"/>

    <!-- === FLAT BOTTOM (thin visible strip at body base — implies depth, not a separate shape) === -->
    <!-- Just a thin dark band at the very bottom of the body suggesting the bottom face -->
    <rect x="60" y="328" width="130" height="3" fill="#5A4228" opacity="0.6"/>
    <rect x="60" y="330" width="130" height="1" fill="rgba(0,0,0,0.3)"/>

    <!-- === BAG BODY — squatter proportions (w:h ≈ 1:1.5) === -->
    <path d="M60 330 L190 330 L178 142 L72 142 Z" fill="url(#kraft-front)" filter="url(#paper-grain)"/>
    <path d="M60 330 L190 330 L178 142 L72 142 Z" fill="url(#kraft-vertical)"/>
    <path d="M60 330 L190 330 L178 142 L72 142 Z" fill="url(#warm-glow)"/>

    <!-- Left edge highlight -->
    <path d="M60 330 L72 142 L74 142 L62 330 Z" fill="rgba(255,235,190,0.35)"/>
    <!-- Right edge shadow (fold toward side gusset) -->
    <path d="M187 330 L175 142 L178 142 L190 330 Z" fill="rgba(0,0,0,0.25)"/>

    <!-- Paper crease lines (vertical wrinkles only — no horizontal crease) -->
    <line x1="100" y1="152" x2="92" y2="325" stroke="rgba(0,0,0,0.06)" stroke-width="0.8"/>
    <line x1="100.5" y1="152" x2="92.5" y2="325" stroke="rgba(255,240,200,0.06)" stroke-width="0.5"/>
    <line x1="130" y1="148" x2="125" y2="327" stroke="rgba(0,0,0,0.05)" stroke-width="0.8"/>
    <line x1="155" y1="146" x2="152" y2="328" stroke="rgba(0,0,0,0.07)" stroke-width="0.6"/>
    <line x1="155.5" y1="146" x2="152.5" y2="328" stroke="rgba(255,240,200,0.05)" stroke-width="0.4"/>

    <!-- === SIDE GUSSET (right side, darker, angled — matches body bottom y=330) === -->
    <path d="M190 330 L208 320 L196 142 L178 142 Z" fill="url(#kraft-side)" filter="url(#paper-grain)"/>
    <path d="M190 330 L178 142" stroke="rgba(0,0,0,0.22)" stroke-width="0.8"/>
    <path d="M206 322 L194 144 L196 142 L208 320 Z" fill="rgba(0,0,0,0.2)"/>

    <!-- === TOP FOLD (rolled down, with visible tin-tie) === -->
    <!-- Back fold layer -->
    <rect x="70" y="126" width="112" height="18" fill="#6A5030"/>
    <rect x="70" y="126" width="112" height="1" fill="rgba(255,230,180,0.15)"/>
    <rect x="70" y="142" width="112" height="2" fill="rgba(0,0,0,0.35)"/>
    <!-- Front fold layer (rolled down) -->
    <path d="M72 142 L178 142 L176 126 L74 126 Z" fill="url(#kraft-fold)" filter="url(#paper-grain)"/>
    <rect x="72" y="142" width="106" height="1.5" fill="rgba(0,0,0,0.3)"/>
    <rect x="74" y="126" width="102" height="1.2" fill="rgba(255,235,190,0.35)"/>
    <!-- Side gusset fold extension -->
    <path d="M178 142 L198 142 L196 126 L176 126 Z" fill="#5E4528"/>
    <path d="M178 142 L176 126" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>

    <!-- === TIN-TIE (more prominent with wire bump) === -->
    <!-- Wire itself (thicker, with a visible bend/bump in middle) -->
    <line x1="84" y1="133" x2="170" y2="133" stroke="#2A2018" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Wire highlight (catches light) -->
    <line x1="84" y1="132.5" x2="170" y2="132.5" stroke="rgba(255,230,180,0.2)" stroke-width="0.6" stroke-linecap="round"/>
    <!-- Wire bump in center (characteristic of a crimped tin-tie — raised hump) -->
    <path d="M120 133 Q127 128, 134 133" stroke="#2A2018" stroke-width="2" fill="none"/>
    <path d="M120 133 Q127 128.5, 134 133" stroke="rgba(255,230,180,0.18)" stroke-width="0.5" fill="none"/>
    <!-- Tin-tie ends (bent wings) -->
    <path d="M83 133 Q78 132, 79 128" stroke="#2A2018" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M171 133 Q176 132, 175 128" stroke="#2A2018" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- === LABEL (white sticker, subtle curvature from bag bulge) === -->
    <rect x="93" y="200" width="62" height="72" rx="1" fill="url(#label-bg)"/>
    <!-- Left/right edge shadow suggests bag curvature under the label -->
    <rect x="93" y="200" width="5" height="72" rx="0.5" fill="rgba(0,0,0,0.06)"/>
    <rect x="150" y="200" width="5" height="72" rx="0.5" fill="rgba(0,0,0,0.05)"/>
    <!-- Center is brightest (convex surface highlight) -->
    <rect x="112" y="205" width="18" height="60" fill="rgba(255,255,255,0.04)"/>
    <rect x="93" y="200" width="62" height="72" rx="1" fill="none" stroke="#C5B89E" stroke-width="0.5"/>
    <rect x="93" y="200" width="62" height="1.5" fill="rgba(0,0,0,0.06)"/>
    <rect x="93" y="270" width="62" height="1.5" fill="rgba(0,0,0,0.04)"/>

    <!-- Label text -->
    <text x="124" y="215" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="5.5" font-weight="700" fill="#3A3028" letter-spacing="1.3">SPECIALTY</text>
    <text x="124" y="224" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-size="8" font-weight="700" fill="#3A3028" letter-spacing="1.8">COFFEE</text>
    <line x1="102" y1="230" x2="146" y2="230" stroke="#C5B89E" stroke-width="0.5"/>
    <text x="124" y="240" text-anchor="middle" font-family="'Inter',sans-serif" font-size="4" fill="#6B5D4E" letter-spacing="0.8">SINGLE ORIGIN</text>
    <text x="124" y="248" text-anchor="middle" font-family="'Inter',sans-serif" font-size="4" fill="#6B5D4E" letter-spacing="0.8">MEDIUM ROAST</text>
    <text x="124" y="261" text-anchor="middle" font-family="'Inter',sans-serif" font-size="4.5" fill="#3A3028" letter-spacing="0.5" font-weight="600">12 oz / 340g</text>

    <!-- === LOOSE BEANS (5 scattered around base) === -->
    <g>
      <!-- Bean 1 — front right of bag -->
      <ellipse cx="202" cy="345" rx="6" ry="3.8" fill="#3D2518" transform="rotate(-25 202 345)"/>
      <path d="M197 344 Q202 346, 207 344" stroke="#1A0E07" stroke-width="0.5" fill="none" transform="rotate(-25 202 345)"/>
      <!-- Bean 2 — further right -->
      <ellipse cx="216" cy="350" rx="5.5" ry="3.5" fill="#4A3020" transform="rotate(40 216 350)"/>
      <path d="M211 349 Q216 351, 221 349" stroke="#1A0E07" stroke-width="0.5" fill="none" transform="rotate(40 216 350)"/>
      <!-- Bean 3 — left of bag -->
      <ellipse cx="44" cy="348" rx="5.5" ry="3.5" fill="#3D2518" transform="rotate(-50 44 348)"/>
      <path d="M39 347 Q44 349, 49 347" stroke="#1A0E07" stroke-width="0.5" fill="none" transform="rotate(-50 44 348)"/>
      <!-- Bean 4 — front center-right -->
      <ellipse cx="195" cy="352" rx="5" ry="3.2" fill="#2D1810" transform="rotate(15 195 352)"/>
      <!-- Bean 5 — left near base, partially behind bag -->
      <ellipse cx="52" cy="340" rx="5.5" ry="3.5" fill="#4A3020" transform="rotate(30 52 340)"/>
      <path d="M47 339 Q52 341, 57 339" stroke="#1A0E07" stroke-width="0.5" fill="none" transform="rotate(30 52 340)"/>
    </g>

  </svg>